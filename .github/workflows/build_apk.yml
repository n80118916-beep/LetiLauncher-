# Имя рабочего процесса, отображаемое на вкладке Actions
name: Flutter Build APK

# Триггеры, когда запускается этот workflow
on:
  push:
    branches:
      - main       # Запускается при пуше в главную ветку
      - develop    # Запускается при пуше в ветку develop
    tags:
      - 'v*.*.*'   # Запускается при создании тега, начинающегося с 'v' (например, v1.0.0)

  pull_request:
    branches:
      - main       # Запускается при создании/обновлении PR в main
      - develop    # Запускается при создании/обновлении PR в develop

# Задачи, которые будут выполняться
jobs:
  build_apk:
    name: Build Android APK # Имя задачи
    runs-on: ubuntu-latest # Используем самый свежий образ Ubuntu

    steps:
      # 1. Получение кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4 # Обновленная версия checkout action

      # 2. Настройка Flutter SDK
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0' # Укажите вашу версию Flutter (или 'stable', 'beta', 'dev')
          channel: 'stable'         # Используем стабильный канал Flutter

      # 3. Получение зависимостей проекта
      - name: Get dependencies
        run: flutter pub get

      # 4. Сборка APK в релизной конфигурации
      #    --release: Для оптимизированной сборки
      #    --target: Указывает точку входа, если она отличается от lib/main.dart
      - name: Build Release APK
        run: flutter build apk --release --target=lib/main.dart
        # Если вы хотите указать конкретную версию Android SDK для сборки,
        # можно добавить переменную окружения, например:
        # env:
        #   ANDROID_SDK_ROOT: /usr/local/android-sdk

      # 5. Загрузка собранного APK как артефакт
      #    Артефакты можно будет скачать со страницы завершенного запуска Actions.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4 # Обновленная версия upload-artifact action
        with:
          name: app-release.apk # Имя артефакта (будет видно при скачивании)
          path: build/app/outputs/flutter-apk/app-release.apk # Путь к собранному APK файлу

